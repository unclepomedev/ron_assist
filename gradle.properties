group = com.github.unclepomedev.ronassist
version = 0.1.11

pluginRepositoryUrl = https://github.com/unclepomedev/ron_assist

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# needed due to an upstream bug.
# See: https://github.com/JetBrains/intellij-platform-gradle-plugin/issues/2183
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=\
  com.intellij.openRewrite,\
  com.intellij.ja,\
  com.intellij.ko,com.intellij.zh,\
  org.jetbrains.plugins.vue
